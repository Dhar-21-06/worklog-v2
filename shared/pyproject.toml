[project]
name = "worklog-shared"
version = "0.1.0"
description = "Constants, enums, and Pydantic models shared between the WorkLog backend and desktop-agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worklog_shared*"]
