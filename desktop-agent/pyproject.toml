[project]
name = "worklog-desktop-agent"
version = "0.1.0"
description = "WorkLog v2 Windows desktop agent (tray, scheduler, reminder popup)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "APScheduler>=3.10",
    "requests>=2.32",
    "pydantic-settings>=2.3",
    # worklog-shared installed as a separate editable step - see
    # scripts/setup_desktop_agent.sh and docs/getting-started.md.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
